<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <rect width="144" height="144" rx="18" fill="#1a1a2e"/>

  <!-- 2x2 quadrant grid -->
  <rect x="8"  y="8"  width="60" height="60" rx="5" fill="#0a2744" stroke="#00aaff" stroke-width="2.5"/>
  <rect x="76" y="8"  width="60" height="60" rx="5" fill="#0a2744" stroke="#00aaff" stroke-width="2.5"/>
  <rect x="8"  y="76" width="60" height="60" rx="5" fill="#0a2744" stroke="#ff6600" stroke-width="2.5"/>
  <rect x="76" y="76" width="60" height="60" rx="5" fill="#0a2744" stroke="#ff6600" stroke-width="2.5"/>

  <!-- Play arrows -->
  <polygon points="22,26 22,50 46,38" fill="#00aaff"/>
  <polygon points="90,26 90,50 114,38" fill="#00aaff"/>
  <polygon points="22,94 22,118 46,106" fill="#ff6600"/>
  <polygon points="90,94 90,118 114,106" fill="#ff6600"/>

  <!-- Center crosshair divider (subtle) -->
  <line x1="72" y1="4"   x2="72" y2="140" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <line x1="4"  y1="72"  x2="140" y2="72" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
</svg>
