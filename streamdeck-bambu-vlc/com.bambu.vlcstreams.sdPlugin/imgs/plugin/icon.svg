<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <rect width="144" height="144" rx="18" fill="#1a1a2e"/>

  <!-- 2x2 grid of screen quadrants -->
  <rect x="10" y="10" width="57" height="57" rx="6" fill="#0d3b6e" stroke="#00aaff" stroke-width="2"/>
  <rect x="77" y="10" width="57" height="57" rx="6" fill="#0d3b6e" stroke="#00aaff" stroke-width="2"/>
  <rect x="10" y="77" width="57" height="57" rx="6" fill="#0d3b6e" stroke="#00aaff" stroke-width="2"/>
  <rect x="77" y="77" width="57" height="57" rx="6" fill="#0d3b6e" stroke="#00aaff" stroke-width="2"/>

  <!-- VLC play triangle in each quadrant -->
  <polygon points="25,28 25,49 44,38.5" fill="#00aaff"/>
  <polygon points="92,28 92,49 111,38.5" fill="#00aaff"/>
  <polygon points="25,95 25,116 44,105.5" fill="#ff6600"/>
  <polygon points="92,95 92,116 111,105.5" fill="#ff6600"/>

  <!-- BambuLabs "B" hint – small dots on each quadrant suggesting printer status -->
  <circle cx="50" cy="38.5" r="3" fill="#00aaff" opacity="0.6"/>
  <circle cx="117" cy="38.5" r="3" fill="#00aaff" opacity="0.6"/>
  <circle cx="50" cy="105.5" r="3" fill="#ff6600" opacity="0.6"/>
  <circle cx="117" cy="105.5" r="3" fill="#ff6600" opacity="0.6"/>
</svg>
