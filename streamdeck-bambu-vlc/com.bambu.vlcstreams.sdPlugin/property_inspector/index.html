<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BambuLabs VLC Streams – Settings</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --surface: #2a2a2a;
      --accent: #00aaff;
      --text: #e0e0e0;
      --muted: #888;
      --border: #444;
      font-family: system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      padding: 12px 14px;
    }

    h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }

    input[type="text"], input[type="number"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 6px 8px;
      font-size: 13px;
      width: 100%;
    }

    input:focus { outline: 2px solid var(--accent); border-color: transparent; }

    .hint { color: var(--muted); font-size: 11px; margin-top: 2px; }

    hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

    .footer { color: var(--muted); font-size: 10px; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>

<h2>BambuLabs VLC Streams</h2>

<div class="row">
  <label>VLC Executable Path (optional)</label>
  <input type="text" id="vlcPath" placeholder="Auto-detect" />
  <span class="hint">Leave blank to use default: C:\Program Files\VideoLAN\VLC\vlc.exe</span>
</div>

<div class="row">
  <label>Taskbar Height (px)</label>
  <input type="number" id="taskbarHeight" value="48" min="0" max="200" />
  <span class="hint">Adjust if windows overlap the taskbar</span>
</div>

<div class="row">
  <label>Launch Delay Between Streams (seconds)</label>
  <input type="number" id="launchDelay" value="0.6" min="0.1" max="5" step="0.1" />
</div>

<hr />

<div class="hint" style="text-align:center;">
  Settings are saved automatically and passed to the Python script via environment variables.
</div>

<div class="footer">BambuLabs VLC Streams v1.0.0</div>

<script>
  // Stream Deck Property Inspector SDK connection
  var websocket = null;
  var uuid = null;
  var settings = {};

  function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
    uuid = inUUID;
    var actionInfo = JSON.parse(inActionInfo);
    settings = actionInfo.payload.settings || {};

    // Populate UI from saved settings
    document.getElementById("vlcPath").value = settings.vlcPath || "";
    document.getElementById("taskbarHeight").value = settings.taskbarHeight ?? 48;
    document.getElementById("launchDelay").value = settings.launchDelay ?? 0.6;

    websocket = new WebSocket("ws://127.0.0.1:" + inPort);

    websocket.onopen = function () {
      websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
    };

    // Save settings on any input change
    ["vlcPath", "taskbarHeight", "launchDelay"].forEach(function (id) {
      document.getElementById(id).addEventListener("input", saveSettings);
    });
  }

  function saveSettings() {
    settings.vlcPath = document.getElementById("vlcPath").value.trim();
    settings.taskbarHeight = parseInt(document.getElementById("taskbarHeight").value, 10) || 48;
    settings.launchDelay = parseFloat(document.getElementById("launchDelay").value) || 0.6;

    if (websocket && websocket.readyState === WebSocket.OPEN) {
      websocket.send(JSON.stringify({
        event: "setSettings",
        context: uuid,
        payload: settings
      }));
    }
  }
</script>

</body>
</html>
