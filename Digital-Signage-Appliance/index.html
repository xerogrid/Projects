<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02050a" />
    <title>Fulcrum Builds</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="signage" aria-label="Fulcrum Builds convention sign">
      <div class="ambient-glow" aria-hidden="true"></div>
      <div class="grid-floor" aria-hidden="true"></div>

      <svg
        class="circuit-board"
        viewBox="0 0 1920 1080"
        preserveAspectRatio="xMidYMid slice"
        aria-hidden="true"
      >
        <defs>
          <filter id="cyan-glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="orange-glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <linearGradient id="trace-gradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#087998" />
            <stop offset="0.5" stop-color="#45f4ff" />
            <stop offset="1" stop-color="#087998" />
          </linearGradient>
        </defs>

        <g class="trace-layer trace-layer--cyan">
          <path d="M0 118 H270 L332 180 H575" />
          <path d="M0 172 H190 L260 242 H430" />
          <path d="M1920 98 H1660 L1594 164 H1440" />
          <path d="M1920 154 H1740 L1684 210 H1532" />
          <path d="M0 730 H230 L316 644 H485" />
          <path d="M1920 720 H1690 L1608 638 H1450" />
          <path d="M85 1080 V926 L146 865 H315" />
          <path d="M1835 1080 V930 L1772 867 H1605" />
        </g>

        <g class="trace-layer trace-layer--orange">
          <path d="M0 275 H150 L212 337 H360" />
          <path d="M1920 292 H1770 L1710 352 H1582" />
          <path d="M0 810 H130 L204 884 H395" />
          <path d="M1920 808 H1790 L1718 880 H1535" />
        </g>

        <g class="node-layer">
          <circle cx="270" cy="118" r="7" />
          <circle cx="430" cy="242" r="7" />
          <circle cx="1660" cy="98" r="7" />
          <circle cx="1532" cy="210" r="7" />
          <circle cx="316" cy="644" r="7" />
          <circle cx="1608" cy="638" r="7" />
          <circle cx="146" cy="865" r="7" />
          <circle cx="1772" cy="867" r="7" />
        </g>
      </svg>

      <header class="brand">
        <span class="brand__bracket" aria-hidden="true"></span>
        <div class="brand__copy">
          <p class="brand__label">Maker showcase</p>
          <p class="brand__name">Fulcrum Builds</p>
        </div>
        <span class="brand__signal" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
      </header>

      <section class="hero">
        <div class="hero__copy">
          <p class="hero__kicker">
            <span aria-hidden="true"></span>
            Animatronic droids online
          </p>
          <h1>
            <span class="hero__line">Ask me about</span>
            <span class="hero__line hero__line--accent">my robots</span>
          </h1>
          <div class="photo-callout">
            <span class="photo-callout__corner photo-callout__corner--left" aria-hidden="true"></span>
            <span class="photo-callout__dot" aria-hidden="true"></span>
            <strong>Photo ops welcome</strong>
            <span class="photo-callout__dot" aria-hidden="true"></span>
            <span class="photo-callout__corner photo-callout__corner--right" aria-hidden="true"></span>
          </div>
        </div>

        <div class="machine" aria-hidden="true">
          <div class="machine__halo"></div>
          <svg class="machine__assembly" viewBox="0 0 560 560">
            <defs>
              <radialGradient id="core-fill">
                <stop offset="0" stop-color="#bfffff" />
                <stop offset="0.18" stop-color="#2ee9ff" />
                <stop offset="0.55" stop-color="#087a9a" />
                <stop offset="1" stop-color="#02050a" />
              </radialGradient>
              <filter id="machine-glow" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="7" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <g class="gear gear--outer">
              <circle cx="280" cy="280" r="208" />
              <circle class="gear__teeth" cx="280" cy="280" r="230" />
              <circle class="gear__inner" cx="280" cy="280" r="176" />
            </g>

            <g class="gear gear--middle">
              <circle cx="280" cy="280" r="142" />
              <circle class="gear__teeth" cx="280" cy="280" r="157" />
              <circle class="gear__inner" cx="280" cy="280" r="112" />
            </g>

            <g class="rotor">
              <path d="M280 112 L307 226 L448 280 L307 334 L280 448 L253 334 L112 280 L253 226 Z" />
              <circle cx="280" cy="280" r="76" />
            </g>

            <g class="core" filter="url(#machine-glow)">
              <circle cx="280" cy="280" r="52" />
              <circle cx="280" cy="280" r="26" />
              <circle class="core__light" cx="280" cy="280" r="12" />
            </g>

            <g class="orbit orbit--one">
              <circle cx="280" cy="52" r="8" />
            </g>
            <g class="orbit orbit--two">
              <circle cx="478" cy="280" r="6" />
            </g>
          </svg>
          <div class="machine__readout">
            <span>Servo array</span>
            <i></i>
            <span>Active</span>
          </div>
        </div>
      </section>

      <footer class="topics">
        <span>3D printing</span>
        <i aria-hidden="true"></i>
        <span>Making</span>
        <i aria-hidden="true"></i>
        <span>Arduino robotics</span>
      </footer>

      <div class="frame frame--top-left" aria-hidden="true"></div>
      <div class="frame frame--top-right" aria-hidden="true"></div>
      <div class="frame frame--bottom-left" aria-hidden="true"></div>
      <div class="frame frame--bottom-right" aria-hidden="true"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
