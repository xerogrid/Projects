name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  digital-signage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Digital-Signage-Appliance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  droid-foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install platformio
      - run: pio run --project-dir Droid-Foundry
