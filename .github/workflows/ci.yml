name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  digital-signage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Digital-Signage-Appliance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  droid-foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            Droid-Foundry/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('Droid-Foundry/platformio.ini') }}
      - run: python -m pip install --upgrade pip platformio
      - run: pio run --project-dir Droid-Foundry
