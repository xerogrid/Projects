; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Firmware lives in the droid folders. Each environment compiles one wrapper
; under src/ that includes the matching production .cpp file.

[platformio]
default_envs = assassin-london, pit-droid-pir, battle-droid-pir

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
lib_ldf_mode = deep+

[env:assassin-london]
build_src_filter = -<*> +<assassin_london.cpp>
lib_deps =
	arduino-libraries/Servo@^1.2.2
	adafruit/Adafruit NeoPixel@^1.12.4
	featherfly/SoftwareSerial@^1.0
	dfrobot/DFRobotDFPlayerMini@^1.0.6

[env:pit-droid-pir]
build_src_filter = -<*> +<pit_droid_pir.cpp>
lib_deps =
	arduino-libraries/Servo@^1.2.2

[env:battle-droid-pir]
build_src_filter = -<*> +<battle_droid_pir.cpp>
lib_deps =
	arduino-libraries/Servo@^1.2.2
